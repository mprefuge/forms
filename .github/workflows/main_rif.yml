# Docs for the Azure Web Apps Deploy action: https://github.com/azure/functions-action
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js project to Azure Function App - rif

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

# One deploy at a time; a newer push to main waits for the previous deploy to finish.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  AZURE_FUNCTIONAPP_PACKAGE_PATH: '.' # set this to the path to your web app project, defaults to the repository root
  NODE_VERSION: '22.x' # must match the Function App's WEBSITE_NODE_DEFAULT_VERSION / runtime stack

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - name: 'Checkout GitHub Action'
        uses: actions/checkout@v4

      - name: Setup Node ${{ env.NODE_VERSION }} Environment
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: 'Install, build and test'
        shell: bash
        run: |
          pushd './${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}'
          npm ci
          npm run build
          npm test
          popd

      - name: 'Remove development dependencies from the deployment package'
        shell: bash
        run: |
          pushd './${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}'
          npm prune --omit=dev
          popd

      - name: Zip artifact for deployment
        # Only ship what the Functions host needs at runtime.
        run: zip -r release.zip host.json package.json package-lock.json dist node_modules

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: release.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build
    # Only deploy to Azure when code lands on main (a merged PR produces a push
    # to main) or on a manual dispatch. Pull request events run the build/test
    # job for CI but never reach this deploy job.
    # Deploying on the push-to-main event keeps the OIDC subject as
    # refs/heads/main, which matches the existing Azure federated credential.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push'
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: Unzip artifact for deployment
        run: |
          unzip -q release.zip
          rm release.zip

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_BA68EF82C4DB425A8BF0D7AC760AB99D }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_E84209A5EC094C5695E5708C9A1822B4 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_C393C3C90F4D4190B1E4BC40F76828CB }}

      - name: 'Run Azure Functions Action'
        uses: Azure/functions-action@v1
        id: fa
        with:
          app-name: 'rif'
          slot-name: 'Production'
          package: ${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}
