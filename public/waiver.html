<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Parental Waiver & Consent Form - Refuge International</title>
  <meta name="description" content="Submit a parental waiver and consent form for Refuge International programs">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link href="./waiver.css" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #f9fafb 0%, #ffffff 100%);
      min-height: 100vh;
      padding: 20px;
    }
  </style>
</head>
<body>
  <h1>Parental Waiver &amp; Consent Form</h1>
  <p>This demo page shows both rendering options provided by the waiver script.</p>
  <p>
    <button id="open-modal" class="ri-btn ri-btn-primary">
      Click here to open the waiver in a modal popup
    </button>
  </p>
  <p>The form will also render inline in the container below (default behavior):</p>
  <div id="waiver-app"></div>
  
  <script>
    function initializeWaiverPage() {
      const btn = document.getElementById('open-modal');
      if (!btn) return;
      btn.addEventListener('click', () => {
        if (typeof openModal === 'function') {
          openModal({
            onOpen(container) {
              // when using modal, render the waiver form inside the new container
              if (window.__ri_waiver) {
                window.__ri_waiver.hostOverride = container;
                if (typeof window.__ri_waiver.resetState === 'function') {
                  window.__ri_waiver.resetState();
                }
                if (typeof window.__ri_waiver.render === 'function') {
                  window.__ri_waiver.render();
                }
              }
            }
          });
        } else {
          alert('modal helper not available');
        }
      });
    }
  </script>
  <script src="./waiver.js" onload="initializeWaiverPage()"></script>
</body>
</html>
